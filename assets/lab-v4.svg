  <g><circle cx="790" cy="198" r="44" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/><text x="790" y="193" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">CONTROL</text><text x="790" y="212" fill="#64748b" font-size="11" text-anchor="middle">rules + state</text></g>
