<rect x="8" y="8" width="1384" height="374" rx="30" fill="url(#bg)" stroke="#1e293b"/>
<text x="44" y="52" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750">The research → system loop</text>
<text x="44" y="79" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">A common architecture across AI safety, scientific ML, robot learning and workflow systems.</text>

