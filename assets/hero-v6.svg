<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
<defs>
  <radialGradient id="bg"><stop stop-color="#121b35"/><stop offset=".55" stop-color="#070b16"/><stop offset="1" stop-color="#03050a"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".45" stop-color="#7c3aed"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
</defs>

<rect x="8" y="8" width="1384" height="484" rx="34" fill="url(#bg)" stroke="#1f2937"/>
<rect x="8" y="8" width="1384" height="484" rx="34" fill="url(#grid)"/>

<ellipse cx="1030" cy="240" rx="220" ry="150" fill="#22d3ee" opacity=".10" filter="url(#blur)">
 <animate attributeName="cx" values="980;1080;980" dur="9s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="320" cy="120" rx="160" ry="120" fill="#8b5cf6" opacity=".10" filter="url(#blur)">
 <animate attributeName="cy" values="120;180;120" dur="8s" repeatCount="indefinite"/>
</ellipse>

<!-- Perspective floor -->
<path d="M70 402 L1330 402 M120 432 L1280 432 M190 462 L1210 462" stroke="#22d3ee" stroke-opacity=".12"/>
<path d="M170 360 L70 402 M300 360 L230 462 M480 360 L420 462 M920 360 L980 462 M1100 360 L1190 462 M1230 360 L1330 402" stroke="#8b5cf6" stroke-opacity=".10"/>

<!-- 3D core -->
<g transform="translate(1010 238)">
 <ellipse cx="0" cy="110" rx="155" ry="28" fill="#22d3ee" opacity=".12" filter="url(#glow)">
   <animate attributeName="rx" values="135;170;135" dur="4s" repeatCount="indefinite"/>
 </ellipse>
 <g>
  <path d="M0 -115 L112 -52 L0 14 L-112 -52 Z" fill="url(#glass)" stroke="#22d3ee" stroke-width="1.6"/>
  <path d="M-112 -52 L0 14 L0 137 L-112 73 Z" fill="#0f172a" fill-opacity=".82" stroke="#7c3aed" stroke-width="1.4"/>
  <path d="M112 -52 L0 14 L0 137 L112 73 Z" fill="#111827" fill-opacity=".72" stroke="#f472b6" stroke-width="1.4"/>
  <circle cx="0" cy="11" r="43" fill="none" stroke="url(#edge)" stroke-width="3">
    <animate attributeName="r" values="38;48;38" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="11" r="8" fill="#e0f2fe"/>
  <ellipse rx="86" ry="34" fill="none" stroke="#22d3ee" stroke-opacity=".7">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="86" ry="34" fill="none" stroke="#f472b6" stroke-opacity=".55" transform="rotate(60)">
   <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="9s" repeatCount="indefinite"/>
  </ellipse>
 </g>
</g>

<!-- floating code cards -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
 <g transform="translate(90 86)">
  <rect width="420" height="196" rx="22" fill="#0b1020" fill-opacity=".86" stroke="#334155"/>
  <circle cx="26" cy="24" r="5" fill="#ef4444"/><circle cx="44" cy="24" r="5" fill="#f59e0b"/><circle cx="62" cy="24" r="5" fill="#22c55e"/>
  <text x="24" y="64" fill="#22d3ee" font-size="14">$ research --focus "AI systems"</text>
  <text x="24" y="91" fill="#94a3b8" font-size="13">data → model → control → verify</text>
  <text x="24" y="121" fill="#a78bfa" font-size="13">state_machine = explicit</text>
  <text x="24" y="148" fill="#f9a8d4" font-size="13">idempotency = required</text>
  <text x="24" y="175" fill="#6ee7b7" font-size="13">ship = only after evidence</text>
 </g>
</g>

<!-- orbital nodes -->
<g fill="#e2e8f0">
 <circle cx="820" cy="90" r="4"><animate attributeName="cy" values="90;110;90" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="1260" cy="92" r="4"><animate attributeName="cx" values="1260;1290;1260" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="1200" cy="338" r="3"><animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="380" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="3.5s" repeatCount="indefinite"/></circle>
</g>

<text x="90" y="350" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">Prakash Chand Jain</text>
<text x="92" y="386" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">AI systems · research · scientific ML · reliable software</text>
<text x="92" y="420" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">build the experiment  /  understand the failure  /  ship the system</text>

<path d="M92 448H1300" stroke="url(#edge)" stroke-width="2" stroke-linecap="round"/>
</svg>