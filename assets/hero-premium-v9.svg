<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
    <stop stop-color="#05070b"/><stop offset=".45" stop-color="#0a1018"/><stop offset="1" stop-color="#05060a"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#7dd3fc" stop-opacity=".15"/><stop offset=".5" stop-color="#e5e7eb" stop-opacity=".75"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".18"/>
  </linearGradient>
  <radialGradient id="halo"><stop stop-color="#93c5fd" stop-opacity=".16"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#cbd5e1" stroke-opacity=".035"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect x="10" y="10" width="1580" height="540" rx="30" fill="url(#bg)" stroke="#1f2937"/>
<rect x="10" y="10" width="1580" height="540" rx="30" fill="url(#grid)"/>

<circle cx="1190" cy="250" r="220" fill="url(#halo)" filter="url(#blur)">
  <animate attributeName="r" values="195;240;195" dur="9s" repeatCount="indefinite"/>
</circle>

<!-- subtle perspective lattice -->
<g stroke="#94a3b8" stroke-opacity=".10" fill="none">
  <path d="M760 410L1260 130M860 470L1390 150M980 510L1510 190"/>
  <path d="M760 410L980 510M920 370L1140 500M1090 320L1290 450"/>
</g>

<!-- signal traces -->
<g fill="none" stroke="url(#line)" stroke-linecap="round">
  <path d="M110 395 C300 360 390 470 570 420 S830 350 1010 395" stroke-width="2" stroke-dasharray="4 14">
    <animate attributeName="stroke-dashoffset" values="0;-140" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M110 420 C300 385 410 455 590 438 S800 388 1010 430" stroke-width="1" stroke-dasharray="3 12">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="4s" repeatCount="indefinite"/>
  </path>
</g>

<!-- 3D research core -->
<g transform="translate(1190 258)">
  <circle r="138" fill="none" stroke="#cbd5e1" stroke-opacity=".10"/>
  <circle r="104" fill="none" stroke="#93c5fd" stroke-opacity=".22" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle r="76" fill="none" stroke="#a78bfa" stroke-opacity=".26" stroke-width="1.5" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
  </circle>
  <path d="M0-92L80-46V46L0 92L-80 46V-46Z" fill="#0b1018" fill-opacity=".85" stroke="#e5e7eb" stroke-opacity=".28"/>
  <path d="M0-92V-6M80-46L0-6L-80-46M80 46L0-6L-80 46M0-6V92" stroke="#94a3b8" stroke-opacity=".28"/>
  <circle r="10" fill="#f8fafc"/>
  <circle r="24" fill="none" stroke="#7dd3fc" stroke-opacity=".7" filter="url(#glow)">
    <animate attributeName="r" values="18;34;18" dur="2.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;.18;.9" dur="2.7s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- small connected nodes -->
<g stroke="#a5b4fc" stroke-opacity=".25" fill="#e2e8f0">
  <path d="M1040 110L1115 175L1010 260L1095 350L1245 392"/>
  <circle cx="1040" cy="110" r="3"/><circle cx="1115" cy="175" r="3"/><circle cx="1010" cy="260" r="3"/><circle cx="1095" cy="350" r="3"/><circle cx="1245" cy="392" r="3"/>
</g>

<!-- editorial text -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="76" y="92" fill="#64748b" font-size="13" letter-spacing="4">PRAKASH CHAND JAIN  /  AI · RESEARCH · SYSTEMS</text>
  <text x="76" y="188" fill="#f8fafc" font-size="62" font-weight="780">Research, then</text>
  <text x="76" y="255" fill="#f8fafc" font-size="62" font-weight="780">make it real.</text>
  <text x="79" y="300" fill="#94a3b8" font-size="17">AI systems · scientific ML · robot learning · reliable software</text>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="79" y="350" fill="#cbd5e1" font-size="13">signal</text>
    <text x="154" y="350" fill="#64748b" font-size="13">→</text>
    <text x="174" y="350" fill="#cbd5e1" font-size="13">model</text>
    <text x="252" y="350" fill="#64748b" font-size="13">→</text>
    <text x="272" y="350" fill="#cbd5e1" font-size="13">control</text>
    <text x="362" y="350" fill="#64748b" font-size="13">→</text>
    <text x="382" y="350" fill="#cbd5e1" font-size="13">verify</text>
    <text x="454" y="350" fill="#64748b" font-size="13">→</text>
    <text x="474" y="350" fill="#cbd5e1" font-size="13">ship</text>
  </g>

  <rect x="76" y="392" width="330" height="44" rx="22" fill="#060a10" stroke="#334155"/>
  <circle cx="100" cy="414" r="5" fill="#34d399">
    <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="116" y="420" fill="#e2e8f0" font-size="13">open to research + engineering</text>
</g>

<!-- metric rail -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <text x="76" y="492" fill="#64748b" font-size="10" letter-spacing="2">9.74/10 GPA</text>
  <text x="275" y="492" fill="#64748b" font-size="10" letter-spacing="2">2K+ GAINN</text>
  <text x="450" y="492" fill="#64748b" font-size="10" letter-spacing="2">100K+ HEP</text>
  <text x="640" y="492" fill="#64748b" font-size="10" letter-spacing="2">85% EVALUATOR</text>
  <text x="845" y="492" fill="#64748b" font-size="10" letter-spacing="2">IDSIA / SUPSI</text>
  <text x="1070" y="492" fill="#64748b" font-size="10" letter-spacing="2">PUNE · INDIA</text>
</g>

<!-- animated focus cursor -->
<g transform="translate(1185 253)">
  <path d="M-12 0H-4M4 0H12M0-12V-4M0 4V12" stroke="#f8fafc" stroke-width="1.5" stroke-opacity=".6"/>
  <circle r="28" fill="none" stroke="#f8fafc" stroke-opacity=".12">
    <animate attributeName="r" values="20;42;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;.02;.35" dur="4s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>