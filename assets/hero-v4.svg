<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#05070d"/><stop offset=".48" stop-color="#0d1220"/><stop offset="1" stop-color="#080a12"/>
    <animate attributeName="x2" values="1400;1100;1400" dur="14s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".52"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#8b5cf6" stop-opacity=".48"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="pink"><stop stop-color="#f472b6" stop-opacity=".38"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect x="8" y="8" width="1384" height="504" rx="36" fill="url(#bg)" stroke="#1e293b"/>
<rect x="8" y="8" width="1384" height="504" rx="36" fill="url(#grid)"/>

<circle cx="200" cy="80" r="180" fill="url(#cyan)" filter="url(#blur)">
  <animate attributeName="cx" values="200;380;200" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="1160" cy="420" r="220" fill="url(#violet)" filter="url(#blur)">
  <animate attributeName="cy" values="420;340;420" dur="10s" repeatCount="indefinite"/>
</circle>
<circle cx="930" cy="85" r="120" fill="url(#pink)" filter="url(#blur)">
  <animate attributeName="cx" values="930;1040;930" dur="9s" repeatCount="indefinite"/>
</circle>

<!-- ambient particles -->
<g fill="#cbd5e1">
  <circle cx="105" cy="110" r="2"><animate attributeName="opacity" values=".2;.9;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="312" cy="60" r="2"><animate attributeName="opacity" values=".8;.2;.8" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="66" r="2"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1240" cy="120" r="2"><animate attributeName="opacity" values=".9;.25;.9" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1305" cy="360" r="2"><animate attributeName="opacity" values=".25;.85;.25" dur="3.7s" repeatCount="indefinite"/></circle>
</g>

<!-- top label -->
<text x="72" y="72" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing="3">PRakash@lab / profile.md</text>
<circle cx="1325" cy="62" r="7" fill="#34d399"><animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/></circle>
<text x="1342" y="68" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">ONLINE</text>

<text x="72" y="160" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800">Prakash Chand Jain</text>
<text x="76" y="208" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">AI Systems Engineer  ·  Research Engineer  ·  Full-Stack Builder</text>

<!-- animated prompt -->
<rect x="72" y="250" width="1256" height="126" rx="20" fill="#080c14" stroke="#334155"/>
<circle cx="99" cy="277" r="6" fill="#f87171"/><circle cx="120" cy="277" r="6" fill="#fbbf24"/><circle cx="141" cy="277" r="6" fill="#34d399"/>
<text x="72" y="322" dx="26" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">$</text>
<text x="96" y="322" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">whoami</text>
<text x="72" y="351" dx="26" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">research → experiment → engineer → verify → ship</text>
<text x="72" y="380" dx="26" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">building systems where intelligence is useful and important state stays trustworthy.</text>

<!-- rotating status -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
  <text x="72" y="438" fill="#22d3ee">STATUS:</text>
  <text x="152" y="438" fill="#e2e8f0">researching multimodal learning</text>
  <text x="152" y="438" fill="#e2e8f0" opacity="0">building reliable agentic systems
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="152" y="438" fill="#e2e8f0" opacity="0">turning experiments into products
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="12s" repeatCount="indefinite"/>
  </text>
</g>

<path d="M72 466H1328" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
<path d="M72 466H1328" stroke="#ffffff" stroke-opacity=".12" stroke-width="10" stroke-linecap="round" filter="url(#soft)"/>
</svg>