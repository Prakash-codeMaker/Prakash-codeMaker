<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.48" stop-color="#111827"/>
      <stop offset="1" stop-color="#090D18"/>
      <animate attributeName="x1" values="0;160;0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glow" x1="160" y1="80" x2="1050" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animate attributeName="y1" values="80;180;80" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="190" cy="72" r="100" fill="#22D3EE" opacity=".12" filter="url(#blur)">
    <animate attributeName="cx" values="190;320;190" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="300" r="120" fill="#8B5CF6" opacity=".13" filter="url(#blur)">
    <animate attributeName="cy" values="300;220;300" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".8">
    <circle cx="90" cy="275" r="4" fill="#22D3EE"><animate attributeName="cy" values="275;245;275" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="88" r="4" fill="#F472B6"><animate attributeName="cy" values="88;118;88" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="82" r="3" fill="#8B5CF6"><animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="70" y="132" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750">Prakash Chand Jain</text>
  <text x="72" y="181" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">
    AI Systems Engineer · Research Engineer · Full-Stack Builder
  </text>
  <text x="72" y="218" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
    I research open-ended problems, build systems, and ship them.
  </text>

  <rect x="72" y="260" width="390" height="52" rx="14" fill="#0F172A" stroke="#334155"/>
  <circle cx="98" cy="286" r="6" fill="url(#glow)">
    <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="116" y="292" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">research → experiment → system</text>
</svg>